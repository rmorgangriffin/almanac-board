<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Griffano Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=DM+Serif+Display&family=Archivo+Black&family=Bricolage+Grotesque:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Mono:wght@400;700&family=UnifrakturMaguntia&family=IM+Fell+English:ital@0;1&family=Graduate&family=Baloo+2:wght@500;700&display=swap">
<style>
/* Layout: 1080×1920 portrait wall board. Header + forecast across the top, work agenda beside a five-week family grid, Po's Dublin panel along the bottom. */
:root {
  --ink: #11152a; --panel: #191e38; --line: #2a3156; --fg: #e9e6dc; --muted: #9097b8;
  --amber: #f2a93b;   /* Morgan, and the accent */
  --sage: #7fc8a9;    /* Corey */
  --lilac: #b9a3ff;   /* Griffano family */
  --rose: #ef8a8a;    /* holidays */
  --display: "Young Serif", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 16px; }
@media (min-width: 900px) { html { font-size: calc(100vw / 67.5); } }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 1.25rem; }
.board { display: grid; gap: 1rem; max-width: 64rem; margin: 0 auto; }
@media (min-width: 900px) { body { height: 100vh; overflow: hidden; } .board { height: 100%; grid-template-rows: auto auto 22rem minmax(0, 1fr) 25rem; } .board.nopast { grid-template-rows: auto auto minmax(0, 1fr) 25rem; } }
.label { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: .9rem; padding: 1rem 1.2rem; min-width: 0; min-height: 0; }
.num { font-variant-numeric: tabular-nums; }
svg.wx { width: 1em; height: 1em; display: inline-block; vertical-align: -.12em; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* Header */
.head { display: grid; grid-template-columns: 1fr auto auto; gap: 2rem; align-items: end; padding: .25rem .2rem 0; }
.latin { font-family: var(--display); font-size: clamp(2.2rem, 8vw, 4.2rem); line-height: 1; }
.latin em { font-style: normal; color: var(--amber); }
.date { margin-top: .4rem; font-size: 1.1rem; color: var(--muted); }
.time { font-family: var(--display); font-size: clamp(2.2rem, 8vw, 4.2rem); line-height: 1; }
.time small { font-family: var(--body); font-size: .32em; color: var(--muted); margin-left: .25rem; }
.now { text-align: right; }
.now .t { font-family: var(--display); font-size: 3rem; line-height: 1; display: flex; gap: .6rem; align-items: center; justify-content: flex-end; }
.now .t svg { color: var(--amber); font-size: 2.6rem; }
.now .s { margin-top: .4rem; color: var(--muted); font-size: 1rem; }

/* Forecast */
.fc { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; }
.fc .d { text-align: center; padding: .2rem 0; }
.fc .d + .d { border-left: 1px solid var(--line); }
.fc .n { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.fc .i { font-size: 2rem; margin: .35rem 0 .2rem; color: var(--fg); }
.fc .hl { font-size: 1.05rem; } .fc .hl span { color: var(--muted); }
.fc .p { font-size: .8rem; color: var(--sage); margin-top: .15rem; min-height: 1em; }

/* Main */
.main { display: grid; grid-template-columns: 19rem minmax(0, 1fr); gap: 1rem; min-height: 0; }
.work { display: flex; flex-direction: column; gap: .9rem; overflow: hidden; }
.work h3 { font-family: var(--display); font-weight: 400; font-size: 1.25rem; margin: 0 0 .4rem; display: flex; justify-content: space-between; align-items: baseline; }
.work h3 span { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.work ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .1rem; }
.work li { display: grid; grid-template-columns: 3.6rem 1fr; gap: .5rem; font-size: .86rem; line-height: 1.2; padding: .15rem .4rem; border-radius: .4rem; }
.work li .tm { font-family: var(--mono); font-size: .78rem; color: var(--muted); padding-top: .1rem; }
.work li .ti { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.work li.past { opacity: .4; }
.work li.nowon { background: color-mix(in srgb, var(--amber) 18%, transparent); }
.work li.nowon .tm { color: var(--amber); }
.work .free { color: var(--muted); font-size: .9rem; font-style: italic; padding-left: .4rem; }

.grid { display: grid; grid-template-rows: auto repeat(5, minmax(0, 1fr)); min-height: 0; padding: .8rem; }
.grid .wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); min-height: 0; }
.grid .dow { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; color: var(--muted); text-align: center; padding-bottom: .4rem; }
.cell { border-top: 1px solid var(--line); padding: .25rem .2rem; min-width: 0; min-height: 0; overflow: hidden; }
.cell + .cell { border-left: 1px solid var(--line); }
.cell .dn { font-family: var(--display); font-size: .95rem; line-height: 1; margin-bottom: .15rem; display: flex; align-items: baseline; gap: .3rem; }
.cell .dn small { font-family: var(--mono); font-size: .6rem; letter-spacing: .1em; color: var(--amber); text-transform: uppercase; }
.cell.past { opacity: .35; }
.cell.today { box-shadow: inset 0 0 0 2px var(--amber); border-radius: .4rem; }
.cell.today .dn { color: var(--amber); }
.ev { font-size: .68rem; line-height: 1.18; margin-top: .18rem; padding-left: .3rem; border-left: 3px solid var(--c, var(--muted)); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ev b { font-weight: 500; color: var(--muted); font-family: var(--mono); font-size: .6rem; }
.ev.allday { background: color-mix(in srgb, var(--c) 22%, transparent); border-radius: .2rem; }
.more { font-size: .62rem; color: var(--muted); margin-top: .15rem; padding-left: .4rem; }
.legend { display: flex; gap: 1rem; justify-content: flex-end; margin-top: .4rem; font-size: .72rem; color: var(--muted); }
.legend i { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; background: var(--c); margin-right: .3rem; vertical-align: 0; }

/* Po */
.po { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 1.2rem; padding: 0; overflow: hidden; }
.photo { position: relative; background: #0b0e1d; min-height: 14rem; }
.photo .layer { position: absolute; inset: 0; display: flex; gap: 4px; opacity: 0; transition: opacity 2.5s ease; }
.photo .layer.on { opacity: 1; }
.photo .slot { position: relative; flex: 1; overflow: hidden; }
.photo .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
.photo .slot.fit img.fg { object-fit: contain; object-position: center; }   /* verticals: whole photo, nothing cut off */
.photo .slot img.bg { inset: -6%; width: 112%; height: 112%; object-fit: cover; filter: blur(20px) brightness(.55); }
.photo .cap { z-index: 2; }
.photo .cap { position: absolute; left: .8rem; bottom: .6rem; font-family: var(--mono); font-size: .65rem; letter-spacing: .1em; color: #fff; text-shadow: 0 1px 4px #000; text-transform: uppercase; }
.dub { padding: 1.2rem 1.2rem 1.2rem 0; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.dub h2 { font-family: var(--display); font-weight: 400; font-size: 2rem; margin: 0; line-height: 1.1; }
.dub .ga { color: var(--sage); font-style: italic; margin-top: .3rem; }
.dub .dt { font-family: var(--display); font-size: 2.6rem; line-height: 1; }
.dub .dt small { font-family: var(--body); font-size: .35em; color: var(--muted); margin-left: .2rem; }
.dub .wnow { display: flex; align-items: center; gap: .6rem; font-size: 1.5rem; font-family: var(--display); }
.dub .wnow svg { color: var(--amber); font-size: 1.9rem; }
.dub .wnow span { font-family: var(--body); font-size: .95rem; color: var(--muted); }
.dub .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: .4rem; text-align: center; font-size: .85rem; }
.dub .mini .i { font-size: 1.4rem; margin: .2rem 0; }
.dub .mini span { color: var(--muted); }

/* Two photo modes, alternating each minute */
.po { transition: grid-template-columns 1.2s ease; }
.po[data-mode="quad"] { grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); }
.side { position: relative; min-width: 0; }
.side > .mode { position: absolute; inset: 0; transition: opacity 1s ease; }
.po[data-mode="dublin"] .mode.quad, .po[data-mode="quad"] .mode.dublin { opacity: 0; pointer-events: none; }
.quadtext { padding: 1.4rem 1.4rem 1.2rem 0; display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
.quadtext blockquote { margin: 0; font-family: var(--display); font-size: 1.55rem; line-height: 1.35; color: var(--fg); text-wrap: balance; }
.quadtext blockquote::before { content: "“"; display: block; font-size: 3.2rem; line-height: .6; color: var(--lilac); margin-bottom: .4rem; }

/* ---------- "Beneath the elms": the precious-days album as a sepia college yearbook ---------- */
#po[data-mode="quad"] { background: #eadcbc; border-color: #a8875a; }
#po[data-mode="quad"] .photo { background: #4a3826; }
#po[data-mode="quad"] .photo .slot img { filter: sepia(.65) saturate(.85) contrast(.95) brightness(1.02); }
#po[data-mode="quad"] .photo::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; box-shadow: inset 0 0 4rem rgba(60, 38, 14, .55); }
#po[data-mode="quad"] .photo .cap { font-family: "IM Fell English", Georgia, serif; font-style: italic; text-transform: none; letter-spacing: 0; font-size: .95rem; color: #f6ecd2; }
.quadtext { background: #eadcbc; color: #3a2814; text-shadow: none; padding: 1.1rem 1.3rem 1.1rem .2rem; }
.quadtext blockquote { font-family: "IM Fell English", Georgia, serif; font-style: italic; font-size: 2.05rem; line-height: 1.3; color: #3a2814; }
.quadtext blockquote::before { color: #6e1a1a; font-family: "IM Fell English", Georgia, serif; font-style: normal; }
.quadtext .foot { display: flex; align-items: center; justify-content: space-between; gap: .8rem; }
.quadtext .pennant { position: relative; width: 11rem; height: 2.6rem; background: #6e1a1a; clip-path: polygon(0 0, 100% 50%, 0 100%); display: flex; align-items: center; padding-left: 1.1rem; font-family: "Graduate", Georgia, serif; font-size: .95rem; letter-spacing: .14em; color: #f3e6c4; transform: rotate(-4deg); transform-origin: left center; }
.quadtext .pennant::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: .45rem; background: #c9a24a; }
.quadtext #quadcap { font-family: "IM Fell English", Georgia, serif; font-style: italic; text-transform: none; letter-spacing: 0; font-size: .95rem; color: #7a6040; text-align: right; }

.msg { padding: 2rem; color: var(--muted); text-align: center; font-size: 1rem; }

@media (max-width: 700px) {
  .head { grid-template-columns: 1fr; gap: 1rem; } .now { text-align: left; } .now .t { justify-content: flex-start; }
  .fc { grid-template-columns: repeat(3, 1fr); row-gap: 1rem; } .fc .d:nth-child(4) { border-left: 0; }
  .main, .po { grid-template-columns: 1fr; }
  .grid .wk { grid-template-columns: repeat(7, minmax(0, 1fr)); } .ev { font-size: .6rem; }
  .dub { padding: 1rem; }
}
@media (prefers-reduced-motion: reduce) { .photo .layer, .side > .mode { transition: none; } }

/* ---------- Strip: forecast + game ---------- */
.strip { display: grid; grid-template-columns: minmax(0, 1fr) 17rem; gap: 1rem; }
.game { padding: .6rem; display: grid; grid-template-rows: auto 1fr; gap: .35rem; }
.game .gh { display: flex; justify-content: space-between; align-items: baseline; }
.game canvas { width: 100%; height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: .35rem; background: var(--gamebg, #070a16); display: block; }
@media (max-width: 700px) { .strip { grid-template-columns: 1fr; } .game canvas { aspect-ratio: 16 / 9; height: auto; } }


/* ---------- This month in past years ---------- */
.past { position: relative; padding: 0; overflow: hidden; background: #0b0e1d; }
.past .layer { position: absolute; inset: 0; opacity: 0; transition: opacity 2.5s ease; }
.past .layer.on { opacity: 1; }
.past .layer .bg { position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; filter: blur(22px) brightness(.55); }
.past .layer .fg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.past .ttl { position: absolute; left: 1rem; top: .9rem; z-index: 2; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
.past .ttl b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; line-height: 1; color: var(--amber); }
.past .ttl span { font-family: var(--display); font-size: 1.5rem; line-height: 1; color: #fff; margin-left: .3rem; }
.past .cap { position: absolute; left: 1rem; bottom: .8rem; z-index: 2; font-family: var(--mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 5px #000; }
.past .cap b { font-family: var(--display); font-weight: 400; font-size: 2rem; letter-spacing: 0; margin-right: .5rem; vertical-align: -.15rem; }
@media (max-width: 900px) { .past { height: 16rem; } }
@media (prefers-reduced-motion: reduce) { .past .layer { transition: none; } }

/* ---------- Look tag ---------- */
.ifbox { margin: 0; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--gamebg, #070a16); color: var(--fg); font-family: var(--mono); font-size: .6rem; line-height: 1.32; padding: .35rem .5rem; border-radius: .35rem; display: flex; flex-direction: column; justify-content: flex-end; white-space: normal; }
.ifbox div { margin: 0; }
.ifbox .cmd { color: var(--amber); margin-top: .3rem; }
.ifbox .room { color: var(--sage); font-weight: 600; }
.ifbox .cur::after { content: "▌"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#looktag { position: fixed; right: max(.6rem, env(safe-area-inset-right, 0px)); bottom: .35rem; z-index: 5; font-family: var(--mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); opacity: .75; }

/* ---------- Looks: same blocks, different palettes and arrangements. One per hour. ---------- */
/* 2 Harbor: sea-glass on deep navy, work column on the right */
html[data-look="harbor"] { --ink: #0b1c26; --panel: #102a37; --line: #1d4252; --fg: #e6f1f0; --muted: #86a8ad; --amber: #f4b860; --sage: #7fd1c1; --lilac: #9fb6ff; --display: "DM Serif Display", Georgia, serif; --gamebg: #061219; }
html[data-look="harbor"] .main { grid-template-columns: minmax(0, 1fr) 19rem; }
html[data-look="harbor"] .work { order: 2; }

/* 4 Orchard: deep green, apple red and gold */
html[data-look="orchard"] { --ink: #10201a; --panel: #163027; --line: #2a4a3c; --fg: #f1eedf; --muted: #9db3a3; --amber: #f0c24b; --sage: #e2674f; --lilac: #b7d47a; --display: "Fraunces", Georgia, serif; --gamebg: #0a1611; }

/* 5 Ember: charcoal and orange, clock centered */
html[data-look="ember"] { --ink: #161412; --panel: #211d1a; --line: #3a322c; --fg: #f3ece4; --muted: #a8998b; --amber: #ff8a3d; --sage: #e8c07a; --lilac: #c99bd6; --display: "Bricolage Grotesque", system-ui, sans-serif; --gamebg: #0e0c0a; }
html[data-look="ember"] .head { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: .6rem; }
html[data-look="ember"] .head .time { order: -1; font-size: clamp(3rem, 12vw, 6rem); font-weight: 700; }
html[data-look="ember"] .now { text-align: center; } html[data-look="ember"] .now .t { justify-content: center; }
html[data-look="ember"] .latin { font-size: 2rem; }

/* 6 Bauhaus: off-white, primary blocks, square corners */
html[data-look="bauhaus"] { --ink: #f2efe8; --panel: #fbfaf6; --line: #111111; --fg: #111111; --muted: #555555; --amber: #e63b2e; --sage: #1d5bd6; --lilac: #f2b705; --rose: #e63b2e; --display: "Archivo Black", Impact, sans-serif; --body: "Bricolage Grotesque", system-ui, sans-serif; --gamebg: #111111; color-scheme: light; }
html[data-look="bauhaus"] .panel { border-radius: 0; border: 3px solid #111; }
html[data-look="bauhaus"] .latin em { color: #1d5bd6; }
html[data-look="bauhaus"] .photo .cap { color: #fff; }
html[data-look="bauhaus"] .cell.today { box-shadow: inset 0 0 0 3px var(--amber); border-radius: 0; }

/* Tropic: deep lagoon teal with coral, mango and aqua; each panel carries a colored top edge */
html[data-look="tropic"] { --ink: #062a30; --panel: #0b3a41; --line: #17575f; --fg: #fdf6e8; --muted: #8fc2bf; --amber: #ffb627; --sage: #ff7b5c; --lilac: #5fe0d0; --rose: #ff8fb8; --display: "Baloo 2", system-ui, sans-serif; --gamebg: #031a1e; }
html[data-look="tropic"] body { background: linear-gradient(180deg, #06323a 0%, #062a30 40%, #0a2240 100%); }
html[data-look="tropic"] .panel { border-top: 4px solid var(--c2, var(--amber)); }
html[data-look="tropic"] .fc { --c2: #ffb627; } html[data-look="tropic"] .game { --c2: #ff7b5c; } html[data-look="tropic"] .past { --c2: #ff8fb8; }
html[data-look="tropic"] .work { --c2: #5fe0d0; } html[data-look="tropic"] .grid { --c2: #ff7b5c; } html[data-look="tropic"] .po { --c2: #ffb627; }
html[data-look="tropic"] .latin, html[data-look="tropic"] .time { font-weight: 700; }
html[data-look="tropic"] .latin em { color: #ff7b5c; }

/* Jewel: sapphire panels on deep plum, ruby, emerald and gold; work column on the right */
html[data-look="jewel"] { --ink: #1c0b2b; --panel: #1b2160; --line: #343d8f; --fg: #fbf3ff; --muted: #aab0e6; --amber: #ffd34d; --sage: #3ee6a0; --lilac: #ff5c8a; --rose: #ff9f43; --display: "Fraunces", Georgia, serif; --gamebg: #0f1240; }
html[data-look="jewel"] body { background: radial-gradient(ellipse at 50% 0%, #3a1257 0%, #1c0b2b 70%); }
html[data-look="jewel"] .panel { border: 2px solid #4b55b8; }
html[data-look="jewel"] .past, html[data-look="jewel"] .po { border-color: #ffd34d; }
html[data-look="jewel"] .main { grid-template-columns: minmax(0, 1fr) 19rem; } html[data-look="jewel"] .work { order: 2; }
html[data-look="jewel"] .latin em { color: #ff5c8a; }

/* 7 Phosphor: green-screen terminal */
html[data-look="phosphor"] { --ink: #030805; --panel: #06110a; --line: #12391f; --fg: #9dfcb5; --muted: #4f9a66; --amber: #d6ff6b; --sage: #59e3ff; --lilac: #ffb3f0; --rose: #ff7a7a; --display: "Space Mono", ui-monospace, monospace; --body: "Space Mono", ui-monospace, monospace; --mono: "Space Mono", ui-monospace, monospace; --gamebg: #010402; }
html[data-look="phosphor"] body { text-shadow: 0 0 .35rem rgba(157, 252, 181, .35); }
html[data-look="phosphor"] .photo .slot img { filter: saturate(.6) contrast(1.05); }

/* ---------- Trial multi-color looks (preview only with ?look=name; not in the hourly rotation) ---------- */
/* Panels get their own colors by overriding the palette variables on that panel. */
.panel { color: var(--fg); }
/* Split complementary: deep teal, terracotta calendar, ochre photos */
html[data-look="canyon"] { --ink: #0c2a2e; --panel: #123a3f; --line: #23555a; --fg: #eef6f2; --muted: #8fbcb8; --amber: #ffc15e; --sage: #a8e6b0; --lilac: #d4c2ff; --rose: #ffb3c1; --display: "DM Serif Display", Georgia, serif; --gamebg: #071b1e; }
html[data-look="canyon"] .grid { --panel: #5a2a1e; --line: #7d4231; --fg: #fbefe4; --muted: #d9b9a6; }
html[data-look="canyon"] .po, html[data-look="canyon"] .past { --panel: #5c4512; --line: #7f6222; --fg: #fdf3dc; --muted: #e0c98f; --lilac: #ffe08a; }
/* Color-blocked by role: navy header, sage forecast, plum calendar, rust agenda, charcoal photos */
html[data-look="quilt"] { --ink: #0e1a33; --panel: #15254a; --line: #2a3f6e; --fg: #eef2fb; --muted: #9fb0d4; --amber: #ffc15e; --sage: #9fe0b0; --lilac: #c9b8ff; --rose: #ffb0c0; --display: "Fraunces", Georgia, serif; --gamebg: #0a1226; }
html[data-look="quilt"] .fc { --panel: #24402f; --line: #3a5c46; --fg: #eef4e8; --muted: #a9c2a8; --amber: #ffd27a; }
html[data-look="quilt"] .grid { --panel: #3a1f45; --line: #573266; --fg: #f6eefa; --muted: #bfa6cc; }

html[data-look="quilt"] .po, html[data-look="quilt"] .past { --panel: #1c1c1e; --line: #333338; --fg: #f2f2f2; --muted: #a0a0a6; }
/* One bold accent: calm indigo, with the forecast in coral */
html[data-look="coral"] { --ink: #12122e; --panel: #1b1c45; --line: #2e3070; --fg: #eceaff; --muted: #9b9cd6; --amber: #ffc15e; --sage: #8fe3b8; --lilac: #c7b5ff; --rose: #ff9fb2; --display: "Bricolage Grotesque", system-ui, sans-serif; --gamebg: #0b0b20; }

/* Mid-century: walnut, avocado forecast, burnt-orange agenda, mustard photos, cream text */
html[data-look="walnut"] { --ink: #1f140c; --panel: #2b1c11; --line: #4a3322; --fg: #f3e3c3; --muted: #b9a07e; --amber: #ffb347; --sage: #b5d67a; --lilac: #d6b8ff; --rose: #ff9e8a; --display: "Fraunces", Georgia, serif; --gamebg: #140d07; }
html[data-look="walnut"] .fc { --panel: #44521f; --line: #5e6e30; --fg: #f5eed8; --muted: #c9cf9e; --amber: #ffcf6a; }
html[data-look="walnut"] .work { --panel: #7a3410; --line: #9a4a20; --fg: #fff0dc; --muted: #f0c79e; --amber: #ffd27a; }
html[data-look="walnut"] .po, html[data-look="walnut"] .past { --panel: #5e4a14; --line: #7d6426; --fg: #fbf0d4; --muted: #e0cb8c; }

/* 8 Dusk: violet-to-rose sky with glass panels, grid and work swapped */
html[data-look="dusk"] { --ink: #1a1030; --panel: rgba(255, 255, 255, .07); --line: rgba(255, 255, 255, .14); --fg: #fbefff; --muted: #c4b0de; --amber: #ffcf70; --sage: #8ff0d2; --lilac: #ff9ed1; --display: "DM Serif Display", Georgia, serif; --gamebg: #12081f; }
html[data-look="dusk"] body { background: linear-gradient(170deg, #1a1030 0%, #3b1d52 55%, #6b2f5b 100%); }
html[data-look="dusk"] .panel { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
html[data-look="dusk"] .main { grid-template-columns: minmax(0, 1fr) 19rem; } html[data-look="dusk"] .work { order: 2; }

/* ---------- Seasonal looks (only on the seasonal boards) ---------- */
html[data-look="holly"] { --ink: #0d2419; --panel: #143524; --line: #2a5a40; --fg: #fbf5e6; --muted: #a9c4b0; --amber: #ffcf5a; --sage: #ff6b6b; --lilac: #9fd0ff; --rose: #ff9ec7; --display: "Fraunces", Georgia, serif; --gamebg: #08170f; }
html[data-look="holly"] .panel { border-color: #3d6b4c; } html[data-look="holly"] .latin em { color: #ff6b6b; }
html[data-look="frost"] { --ink: #0b1531; --panel: #142249; --line: #2b3d75; --fg: #f2f7ff; --muted: #9fb2dc; --amber: #ffd36b; --sage: #7fe3c4; --lilac: #ff7a8a; --rose: #c7a6ff; --display: "DM Serif Display", Georgia, serif; --gamebg: #070e22; }
html[data-look="frost"] body { background: linear-gradient(180deg, #0b1531 0%, #12204a 100%); }
html[data-look="pumpkin"] { --ink: #160e1c; --panel: #23162d; --line: #3f2a4d; --fg: #fbefe2; --muted: #b8a3c4; --amber: #ff8a1f; --sage: #9be564; --lilac: #c08bff; --rose: #ff5c5c; --display: "Fraunces", Georgia, serif; --gamebg: #0d0812; }
html[data-look="confetti"] { --ink: #0d0d1a; --panel: #17172e; --line: #2e2e57; --fg: #fffaf0; --muted: #a9a9d6; --amber: #ffd700; --sage: #4de2c5; --lilac: #ff6ad5; --rose: #7aa7ff; --display: "Bricolage Grotesque", system-ui, sans-serif; --gamebg: #08080f; }
html[data-look="shamrock"] { --ink: #0a2215; --panel: #10321f; --line: #23573a; --fg: #f6fbf2; --muted: #9fc7ab; --amber: #ffa94d; --sage: #7be08f; --lilac: #9fd8ff; --rose: #ff8a8a; --display: "Fraunces", Georgia, serif; --gamebg: #06150c; }

/* header line on seasonal boards and special days */
.season { margin-top: .45rem; font-family: var(--display); font-size: 1.35rem; color: var(--amber); }

.drift { position: fixed; z-index: 3; pointer-events: none; height: 0; transition: height 40min ease, opacity 25min ease; opacity: 0;
  background: radial-gradient(circle at 50% 100%, #fff 58%, transparent 60%) repeat-x 0 0 / 1.1rem 100%, linear-gradient(#fff, #fff) no-repeat 0 100% / 100% 40%;
  border-radius: .4rem .4rem 0 0; }
html.snowing .drift { height: .55rem; opacity: .95; }

/* rain running down the Dublin photo while it's raining there */
.photo .drop { position: absolute; top: -10%; z-index: 2; width: 2px; height: 2.4rem; border-radius: 2px; pointer-events: none; opacity: 0;
  background: linear-gradient(rgba(255,255,255,0), rgba(220,235,255,.55)); }
.po.dubrain[data-mode="dublin"] .photo .drop { animation: drip var(--d, 7s) linear infinite; animation-delay: var(--w, 0s); }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .8; } 85% { opacity: .6; } 100% { transform: translateY(26rem); opacity: 0; } }

/* confetti for gotcha days, birthdays and New Year's */
.confetti { position: fixed; top: -2rem; z-index: 55; width: .55rem; height: .9rem; pointer-events: none; border-radius: 2px; animation: fall var(--d) linear forwards; }
@keyframes fall { to { transform: translate(var(--x), 110vh) rotate(var(--r)); } }

/* a cuckoo at the top of each hour */
#cuckoo { position: fixed; z-index: 50; pointer-events: none; width: 4.2rem; height: 4.6rem; opacity: 0; transition: opacity .6s ease; }
#cuckoo.on { opacity: 1; }
#cuckoo .bird { transform: translateX(-60%); transition: transform .5s cubic-bezier(.3,1.6,.6,1); }
#cuckoo.out .bird { transform: translateX(0); }
#cuckoo.out .beak { animation: peep .5s ease-in-out 3 alternate; transform-box: fill-box; transform-origin: 0 50%; }
@keyframes peep { to { transform: rotate(-25deg); } }
@media (prefers-reduced-motion: reduce) { .drift, #cuckoo .bird { transition: none; } .photo .drop { animation: none; } }

/* Volt and Rouge: the bolder looks, in the rotation since Nov 24 */
html[data-look="volt"] { --ink: #04082e; --panel: #0f2db8; --line: #3352d6; --fg: #ffffff; --muted: #c3cdff; --amber: #ffc15e; --sage: #9effc0; --lilac: #e6d4ff; --rose: #ffb8c8; --display: "Archivo Black", Impact, sans-serif; --gamebg: #020520; }

html[data-look="volt"] .po, html[data-look="volt"] .past, html[data-look="volt"] .alm { --panel: #0a1450; --line: #1e2c80; }
html[data-look="rouge"] { --ink: #2a0508; --panel: #5e0912; --line: #84202b; --fg: #fff1ec; --muted: #e6b3ab; --amber: #ffc15e; --sage: #8ff0e8; --lilac: #e4ccff; --rose: #ffb3c1; --display: "DM Serif Display", Georgia, serif; --gamebg: #1a0204; }
html[data-look="rouge"] .fc, html[data-look="rouge"] .work { --panel: #17b8b0; --line: #0f8f89; --fg: #021c1a; --muted: #083633; --amber: #021c1a; --sage: #083633; --lilac: #083633; }
html[data-look="rouge"] .po, html[data-look="rouge"] .past, html[data-look="rouge"] .alm { --panel: #1c0306; --line: #4a0b12; }

html[data-look="volt"] .work li.nowon, html[data-look="rouge"] .work li.nowon { background: rgba(0, 0, 0, .1); }
html[data-look="volt"] .work li.past, html[data-look="rouge"] .work li.past { opacity: .55; }

/* ---------- the almanac: one row with the "of yore" photos ---------- */
@media (min-width: 900px) { .board.nopast { grid-template-rows: auto auto 22rem minmax(0, 1fr) 25rem; } }
.midrow { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 1rem; min-height: 0; }
.board.nopast .midrow { grid-template-columns: minmax(0, 1fr); }
.alm { padding: .8rem 1rem; overflow: hidden; --ink-line: color-mix(in srgb, var(--fg) 70%, transparent); }

.almbody.off { opacity: 0; }
.alm-k { font-family: "IM Fell English", Georgia, serif; font-size: .85rem; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.moonrow { display: flex; align-items: center; gap: 1rem; margin: .35rem 0 .2rem; text-align: left; }
.moonrow .big { width: 7rem; height: 7rem; flex: none; }
.alm .ink { stroke: var(--ink-line); stroke-width: .8; }
.alm-la { font-family: "IM Fell English", Georgia, serif; font-style: italic; font-size: .85rem; color: var(--muted); opacity: .8; }
.mstrip { display: grid; grid-template-columns: repeat(4, 1fr); gap: .35rem .2rem; width: 100%; margin: .3rem 0 .35rem; }
.mc { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.mc svg { width: 1.9rem; height: 1.9rem; }
.mc .md { font-family: var(--mono); font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: .15rem; }
.mc .mp { font-family: "IM Fell English", Georgia, serif; font-size: .68rem; color: var(--muted); }
.mc.on .md, .mc.on .mp { color: var(--amber); }
.mc.on svg { outline: 1px solid var(--amber); outline-offset: 2px; border-radius: 50%; }
.alm .plate { width: 100%; flex: 1 1 0; min-height: 10.5rem; height: 0; object-fit: contain; margin: .2rem 0 .25rem; filter: sepia(.35) saturate(.85); border-radius: .2rem; }
/* picture cards (sky, in season, bird, meteor): the plate takes all the spare height, the words step down */
.almbody:has(.plate) { gap: .1rem; }
.almbody:has(.plate) .alm-t { font-size: 1.1rem; }
.almbody:has(.plate) .alm-s { font-size: .78rem; line-height: 1.25; }
.almbody:has(.plate) .alm-la { font-size: .74rem; }
.almbody:has(.plate) .alm-k { font-size: .72rem; }
.almbody:has(.plate) .alm-c { margin-top: .15rem; font-size: .55rem; }
.alm-day { width: 100%; height: auto; margin: .4rem 0 .5rem; }
.alm .ink, .alm .ink line { stroke: var(--ink-line); stroke-width: .8; }

.alm svg .axis text { text-anchor: middle; }
.alm svg .lbl { fill: var(--amber); font-style: italic; font-size: 9px; }
.alm-t { font-family: "IM Fell English", Georgia, serif; font-style: italic; font-size: 1.45rem; line-height: 1.15; color: var(--fg); }
.alm-s { font-family: "IM Fell English", Georgia, serif; font-size: .95rem; color: var(--muted); }
.alm-c { margin-top: auto; font-family: "IM Fell English", Georgia, serif; font-size: .62rem; color: var(--muted); opacity: .8; }
.odd { margin-top: .3rem; font-family: "IM Fell English", Georgia, serif; font-style: italic; font-size: 1.05rem; color: var(--muted); }
.odd b { font-style: normal; font-family: var(--display); font-weight: 400; color: var(--amber); }
.skybanner { margin-top: .4rem; padding: .35rem .7rem; border-left: 3px solid var(--amber); background: color-mix(in srgb, var(--amber) 12%, transparent); font-size: .9rem; line-height: 1.35; color: var(--fg); border-radius: .2rem; }
.skybanner b { color: var(--amber); font-weight: 600; }
.now .s2 { margin-top: .25rem; color: var(--muted); font-size: .82rem; }

/* ---------- Po in Dublin: Rocque's 1756 map behind the text, Georgian door colors, Irish, tides ---------- */
.side::before { content: ""; position: absolute; inset: 0; background: url(../img/rocque-dublin.jpg) center / cover no-repeat; mix-blend-mode: screen; opacity: .2; pointer-events: none; transition: opacity 1s ease; }
.po[data-mode="quad"] .side::before { opacity: 0; }
.dub .gadate { font-family: "IM Fell English", Georgia, serif; font-size: .95rem; color: var(--muted); margin-top: .15rem; }
.dub .dubx { font-size: .85rem; color: var(--muted); margin-top: .25rem; }
.tide { display: flex; align-items: center; gap: .6rem; }
.tide svg { width: 3.4rem; height: 3.4rem; flex: none; }
.tide .brass { fill: #a07a36; stroke: #e0c27a; stroke-width: 1.2; }
.tide .face { fill: #f1e6c8; }
.tide .tk line { stroke: #5a4218; stroke-width: .8; }

.tide .needle { stroke: #2a1a08; stroke-width: 1.6; stroke-linecap: round; }

.tide .tv { font-size: .82rem; color: var(--muted); }
.tide .tv b { color: var(--fg); font-weight: 600; }
</style>

<script>
const TZ = "America/New_York", DUB = "Europe/Dublin";
const HOME = { lat: 42.355, lon: -72.703 }, DUBLIN = { lat: 53.3494, lon: -6.2606 };
const KEY = location.hash.slice(1);
const LATIN = ["Solis", "Lunae", "Martis", "Mercurii", "Iovis", "Veneris", "Saturni"];
const CAL = { morgan: "var(--amber)", corey: "var(--sage)", family: "var(--lilac)", holiday: "var(--rose)" };
const $ = id => document.getElementById(id);
const DAY = 86400000;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function parts(date, tz) {
  const o = {}; for (const p of new Intl.DateTimeFormat("en-US", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", weekday: "short", hour: "numeric", minute: "2-digit", hour12: true }).formatToParts(date)) o[p.type] = p.value;
  return o;
}
const isoToday = () => { const p = parts(new Date(), TZ); return `${p.year}-${p.month}-${p.day}`; };
const isoAdd = (iso, n) => new Date(Date.parse(iso + "T12:00:00Z") + n * DAY).toISOString().slice(0, 10);
const dowOf = iso => new Date(iso + "T12:00:00Z").getUTCDay();
const nowHM = () => { const p = {}; for (const x of new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date())) p[x.type] = x.value; return `${p.hour}:${p.minute}`; };
const t12 = hm => { if (!hm) return ""; let [h, m] = hm.split(":").map(Number); const ap = h >= 12 ? "p" : "a"; h = h % 12 || 12; return m ? `${h}:${String(m).padStart(2, "0")}${ap}` : `${h}${ap}`; };

/* ---------- weather icons ---------- */
const ICON = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  part: '<path d="M8 3v1.5M3.5 5.5l1 1M2 10h1.5M12.5 5.5l-1 1"/><path d="M5.6 11.5A3 3 0 1 1 11 8.2"/><path d="M8 20h9a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.4 1.6A3.2 3.2 0 0 0 8 20z"/>',
  cloud: '<path d="M7 19h10a4.5 4.5 0 0 0 .6-9A6 6 0 0 0 6.2 11.6 3.8 3.8 0 0 0 7 19z"/>',
  rain: '<path d="M7 15h10a4.5 4.5 0 0 0 .6-9A6 6 0 0 0 6.2 7.6 3.8 3.8 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
  snow: '<path d="M7 15h10a4.5 4.5 0 0 0 .6-9A6 6 0 0 0 6.2 7.6 3.8 3.8 0 0 0 7 15z"/><path d="M8 19h.01M12 21h.01M16 19h.01M10 22h.01M14 18h.01"/>',
  storm: '<path d="M7 15h10a4.5 4.5 0 0 0 .6-9A6 6 0 0 0 6.2 7.6 3.8 3.8 0 0 0 7 15z"/><path d="M13 15l-2 4h3l-2 4"/>',
  fog: '<path d="M4 9h16M3 13h18M5 17h14"/>'
};
function kind(code) {
  if (code <= 0) return ["sun", "Clear"]; if (code <= 2) return ["part", "Partly cloudy"]; if (code === 3) return ["cloud", "Cloudy"];
  if (code <= 48) return ["fog", "Fog"]; if (code <= 57) return ["rain", "Drizzle"]; if (code <= 67) return ["rain", "Rain"];
  if (code <= 77) return ["snow", "Snow"]; if (code <= 82) return ["rain", "Showers"]; if (code <= 86) return ["snow", "Snow showers"]; return ["storm", "Thunderstorms"];
}

async function weather(loc, tz) {

const b64 = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
let cryptoKey = null;
async function unlock(file, raw) {
  if (!KEY) throw new Error("nokey");
  cryptoKey = cryptoKey || await crypto.subtle.importKey("raw", b64(KEY), "AES-GCM", false, ["decrypt"]);
  const r = await fetch(file + "?v=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error("missing");
  const { iv, ct } = await r.json();
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(iv) }, cryptoKey, b64(ct));
  return raw ? pt : JSON.parse(new TextDecoder().decode(pt));
}

function renderGrid() {

      const evs = (byDate[iso] || []).sort((a, b) => (a.time ? 1 : 0) - (b.time ? 1 : 0) || String(a.time).localeCompare(String(b.time)));

// Two sets (Ada's Dublin photos, the "precious days" album). The panel switches set
// every minute and changes photo every 12 seconds within the set.
let SETS = {}, MODES = [], mi = 0, idx = {}, layer = 0;
async function loadPhotos() {
  try {
    const p = await unlock("/almanac-board-photos/photos.enc");
    SETS = {}; for (const s of p.sets || [{ name: "dublin", photos: p.photos || [] }]) if (s.photos.length) SETS[s.name] = s.photos;
    MODES = Object.keys(SETS); MODES.forEach(m => idx[m] = idx[m] || 0);
    const fm = new URLSearchParams(location.search).get("mode"); if (fm && MODES.includes(fm)) mi = MODES.indexOf(fm);
  } catch (e) {}
  showPhoto();
}
const PHOTO_DIR = "/almanac-board-photos/";
// Landscape photos fill the panel. A vertical is shown whole; when the next photo in the set
// is vertical too, the two sit side by side.
async function loadImg(p) {
  const url = p.src || URL.createObjectURL(new Blob([await unlock(PHOTO_DIR + p.file, true)], { type: "image/jpeg" }));
  const img = new Image(); img.alt = ""; img.className = "fg"; img.src = url;
  await img.decode();
  return { p, url, img, tall: img.naturalHeight > img.naturalWidth * 1.05 };
}
function dropImg(x) { if (x && !x.p.src) URL.revokeObjectURL(x.url); }
let showing = false;
async function showPhoto() {
  const mode = MODES[mi % MODES.length]; if (!mode || showing) return;
  showing = true;
  try {
    $("po").dataset.mode = mode;
    const list = SETS[mode];
    let first, second = null;
    try { first = await loadImg(list[idx[mode] % list.length]); } catch (e) { return; }
    if (first.tall && list.length > 1) {
      try {
        const n = await loadImg(list[(idx[mode] + 1) % list.length]);
        if (n.tall) { second = n; idx[mode]++; } else dropImg(n);
      } catch (e) {}
    }
    const box = $("photo"), old = box.querySelector(".layer.on"), layer = document.createElement("div");
    layer.className = "layer";
    const shots = second ? [first, second] : [first];
    for (const x of shots) {
      const slot = document.createElement("div"); slot.className = "slot";
      if (x.tall) {   // fit the whole photo; a blurred copy fills any gap at the sides
        slot.classList.add("fit");
        const bg = new Image(); bg.alt = ""; bg.className = "bg"; bg.src = x.url; slot.appendChild(bg);
      }
      slot.appendChild(x.img); layer.appendChild(slot);
    }
    box.insertBefore(layer, $("cap"));
    requestAnimationFrame(() => requestAnimationFrame(() => { layer.classList.add("on"); if (old) old.classList.remove("on"); }));
    setTimeout(() => { if (old) { old._shots.forEach(dropImg); old.remove(); } }, 3000);
    layer._shots = shots;
    const dates = [...new Set(shots.map(x => x.p.date).filter(Boolean))].join(" · ");
    $("cap").textContent = dates;
    if (mode === "quad") $("quadcap").textContent = dates;
  } finally { showing = false; }
}
function nextPhoto() { const m = MODES[mi % MODES.length]; if (m) idx[m]++; showPhoto(); }
function nextMode() { mi++; showPhoto(); }

(function arcade() {

  const NAMES = ["Pong", "Showdown", "Atari"], LENGTH = [180000, 180000, 300000];
  const GAMES = window.ATARI || [], C = k => k === "bg" ? (css("--gamebg") || "#070a16") : css("--" + k);
  let gi = +(new URLSearchParams(location.search).get("atari") || Math.floor(Math.random() * 99)), game = null;
  function begin() {
    score = [0, 0]; $("gname").textContent = NAMES[mode];

    if (mode === 2) { if (!GAMES.length) { mode = 0; return begin(); } game = GAMES[gi++ % GAMES.length]; st = game.init(); $("gname").textContent = game.name; }
    if (mode === 0) startPong(); else if (mode === 1) startDuel();

    const s = st;

    for (let i = 0; i < 2; i++) {
      const toward = i === 0 ? s.vx < 0 : s.vx > 0;

      violet: { name: "pressed violet", where: null, treasure: true, seen: "A pressed violet lies on the open page.", taken: "Taken. It is labeled, in a very small hand, Viola." },
      tally:  { name: "tally stick", where: "cellar", treasure: true, seen: "A notched hazel stick is wedged behind the pickles.", taken: "Taken. It was split down the middle long ago. Someone, somewhere, has the other half." }
    };
    const FLAVOR = {
      kitchen: [["pet cat", "The cat permits this, briefly, then looks away as if it never happened."], ["open fridge", "Leftover stuffing, three lemons, and a note that says DON'T."]],
      garden:  [["listen", "The elm creaks. Somewhere a dog disagrees with the mail."], ["climb elm", "You get one boot up before the elm makes its feelings clear."]],
      porch:   [["read doormat", "GO AWAY, it says, in a cheerful serif."], ["knock", "No one answers. You live here."]],
      hall:    [["examine coats", "In one pocket: a ticket stub from a film nobody remembers."], ["xyzzy", "A hollow voice says, \"Wrong house.\""]],
      study:   [["read books", "You read a line of Latin. The Latin reads you back."]],
      cellar:  [["smell", "Vinegar, dust, and a faint note of 1994."]]
    };
    let S, timer = null, running = false;
    const lines = [];
    function out(text, cls) { const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = text; box.appendChild(d); while (box.children.length > 40) box.firstChild.remove(); return d; }
    const here = () => ROOMS[S.room];
    const lit = () => !here().dark || (S.inv.includes("lamp") && S.lampOn);
    const itemsHere = () => Object.keys(ITEMS).filter(k => S.where[k] === S.room);
    const score = () => S.mantel.length * 10;
    function describe() {
      if (!lit()) return ["It is pitch dark. Something small scuttles off into the black. Better not wander here without a light."];
      const r = here(), o = [r.name.toUpperCase() + "|room", r.desc];
      if (S.room === "study" && S.herbOpen) o.push("The herbarium lies open.");
      for (const k of itemsHere()) o.push(ITEMS[k].seen);
      if (S.room === "hall" && S.mantel.length) o.push("On the mantel: " + S.mantel.map(k => "the " + ITEMS[k].name).join(", ") + ".");
      return o;
    }
    function path(to) { // breadth-first route to a room
      const q = [[S.room, []]], seen = { [S.room]: 1 };
      while (q.length) { const [r, p] = q.shift(); if (r === to) return p; for (const [d, n] of Object.entries(ROOMS[r].exits)) if (!seen[n]) { seen[n] = 1; q.push([n, [...p, d]]); } }
      return [];
    }
    function decide() {
      const carrying = S.inv.filter(k => ITEMS[k].treasure);
      if (here().dark && !lit()) return S.inv.includes("lamp") ? "light lamp" : "up";
      if (S.room === "hall" && carrying.length) return "put " + ITEMS[carrying[0]].name + " on mantel";
      const take = itemsHere()[0]; if (take && lit()) return "take " + ITEMS[take].name;
      if (S.room === "study" && !S.herbOpen) return "open herbarium";
      if (Math.random() < .22 && FLAVOR[S.room]) { const f = FLAVOR[S.room][Math.floor(Math.random() * FLAVOR[S.room].length)]; return f[0]; }
      if (Math.random() < .06) return S.moves % 2 ? "inventory" : "look";
      let goal = null;
      if (carrying.length) goal = "hall";
      else if (!S.inv.includes("lamp")) goal = Object.keys(ITEMS).includes("lamp") && S.where.lamp ? S.where.lamp : null;
      if (!goal) { const left = Object.keys(ITEMS).filter(k => ITEMS[k].treasure && !S.mantel.includes(k) && !S.inv.includes(k)); const k = left.find(k => S.where[k]); goal = k ? S.where[k] : left.includes("violet") ? "study" : null; }
      if (goal && goal !== S.room) return path(goal)[0];
      const ex = Object.keys(here().exits); return ex[Math.floor(Math.random() * ex.length)];
    }
    function act(cmd) {
      S.moves++;
      const r = here();
      if (r.exits[cmd] !== undefined || ["north", "south", "east", "west", "up", "down"].includes(cmd)) {
        if (!r.exits[cmd]) return ["You can't go that way."];
        if (here().dark && !lit() && cmd !== "up") return ["You stumble into a shelf. Jars rattle ominously. You think better of it."];
        S.room = r.exits[cmd]; return describe();
      }
      if (cmd === "light lamp") { S.lampOn = true; return ["The lamp flickers, then steadies.", ...describe()]; }
      if (cmd === "open herbarium") { S.herbOpen = true; S.where.violet = "study"; return ["You untie the ribbon. Pages of pressed flowers, each with a Latin name. One falls loose."]; }
      if (cmd.startsWith("take ")) { const k = Object.keys(ITEMS).find(k => cmd === "take " + ITEMS[k].name); S.where[k] = null; S.inv.push(k); return [ITEMS[k].taken]; }
      if (cmd.startsWith("put ")) { const k = Object.keys(ITEMS).find(k => cmd.startsWith("put " + ITEMS[k].name)); S.inv = S.inv.filter(i => i !== k); S.mantel.push(k); return [`Done. The ${ITEMS[k].name} looks right at home. [Your score just went up by 10.]`]; }
      if (cmd === "inventory") return [S.inv.length ? "You are carrying: " + S.inv.map(k => "a " + ITEMS[k].name + (k === "lamp" && S.lampOn ? " (lit)" : "")).join(", ") + "." : "You are empty-handed."];
      if (cmd === "look") return describe();
      const f = (FLAVOR[S.room] || []).find(f => f[0] === cmd); return [f ? f[1] : "Nothing happens."];
    }
    function show(text) { const [t, c] = text.split("|"); out(t, c); }
    function turn() {
      if (!running) return;
      if (score() >= 30) {
        out(`*** You have put every treasure on the mantel. Your score is 30 of 30, in ${S.moves} moves. ***`, "room");
        timer = setTimeout(() => { if (running) { out("— Another day dawns. —"); newGame(); } }, 7000);
        return;
      }
      const cmd = decide(), line = out("> ", "cmd cur");
      let i = 0;
      const typeIt = () => {
        if (!running) return;
        if (i < cmd.length) { line.textContent = "> " + cmd.slice(0, ++i); timer = setTimeout(typeIt, 55 + Math.random() * 60); return; }
        line.classList.remove("cur");
        timer = setTimeout(() => { act(cmd).forEach(show); $("gscore").textContent = `Score ${score()}/30`; timer = setTimeout(turn, 1900); }, 350);
      };
      timer = setTimeout(typeIt, 400);
    }
    function newGame() {
      S = { room: "porch", inv: [], mantel: [], lampOn: false, herbOpen: false, moves: 0, where: Object.fromEntries(Object.entries(ITEMS).map(([k, v]) => [k, v.where])) };
      describe().forEach(show); $("gscore").textContent = "Score 0/30";
      timer = setTimeout(turn, 1500);
    }
    return {
      start() { running = true; box.innerHTML = ""; out("THE HOUSE ON THE HILL"); out("An interactive fiction. Release 1."); newGame(); },
      stop() { running = false; clearTimeout(timer); }
    };
  })();

  begin();
  let last = 0, prev = performance.now(), swapAt = Date.now() + 180000;
  function frame(t) {
    if (t - last >= 33) {
      last = t; if (flash > 0) flash--;
      const steps = Math.min(4, Math.max(1, Math.round((t - prev) / 33))); prev = t;
      if (mode < 2) {
        for (let k = 1; k <= steps; k++) mode ? duel(k === steps) : pong(k === steps);
        $("gscore").textContent = `${score[0]} · ${score[1]}`;
      } else if (game) {
        for (let k = 0; k < steps; k++) game.step(st);
        game.draw(x, st, C); $("gscore").textContent = game.score(st);
      }
      if (Date.now() > swapAt || (mode < 2 && Math.max(...score) >= 11) || (mode === 2 && game && game.over(st))) { mode = (mode + 1) % 3; begin(); swapAt = Date.now() + LENGTH[mode]; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ---------- touches: seasons, special days, live weather, the cuckoo ---------- */
const Q = new URLSearchParams(location.search);
// ?lite=1 turns off the moving extras (walk-ons, confetti, raindrops, snow, cuckoo) for a slow screen.
const LITE = Q.get("lite") === "1"; window.WALK_LITE = LITE;
const md = iso => iso.slice(5);
// Pets' gotcha days (month-day, year they came home)
const GOTCHA = [["07-27", 2016, "Hercules"], ["10-05", 2020, "Nimona"], ["07-01", 2022, "Buster & Lucille"]];
function seasonLine(today) {
  const y = +today.slice(0, 4), m = md(today);
  const until = (mmdd, yy = y) => Math.round((Date.parse(`${yy}-${mmdd}T12:00:00Z`) - Date.parse(today + "T12:00:00Z")) / DAY);
  if (SEASON === "christmas") {
    if (m === "12-24") return "Christmas Eve <small>one more sleep</small>";
    if (m === "12-25") return "Merry Christmas <small>Nollaig Shona</small>";
    if (m === "12-26") return "St. Stephen's Day <small>Lá Fhéile Stiofáin</small>";
    const n = until("12-25"); if (n > 0) return `${n} sleeps till Christmas`;
  }
  if (SEASON === "halloween") { const n = until("10-31"); return n > 0 ? `${n} night${n > 1 ? "s" : ""} till Halloween` : "Happy Halloween <small>Oíche Shamhna</small>"; }
  if (SEASON === "newyear") return m === "12-31" ? `New Year's Eve <small>Oíche Chinn Bliana</small>` : `Happy New Year <small>${y}</small>`;
  if (SEASON === "stpatrick") return "Lá Fhéile Pádraig sona daoibh <small>Happy St. Patrick's Day</small>";
  if (SEASON === "bloomsday") {
    const LINES = ["Stately, plump Buck Mulligan…", "Yes I said yes I will Yes.", "Love loves to love love.", "History is a nightmare from which I am trying to awake.", "Think you're escaping and run into yourself."];
    return `Bloomsday <small>${LINES[new Date().getHours() % LINES.length]}</small>`;
  }
  return "";
}
// Hanukkah: first candle's evening each year (Hebcal). Night N starts at sunset; the day after belongs to the same night.
const HANUKKAH = { 2026: "2026-12-04", 2027: "2027-12-24", 2028: "2028-12-12", 2029: "2029-12-01", 2030: "2030-12-20" };
function hanukkahNight(today) {
  if (Q.get("hanukkah")) return +Q.get("hanukkah");
  const evening = nowHM() >= (window.SUNSET || "16:15");
  for (const y of [+today.slice(0, 4), +today.slice(0, 4) - 1]) {
    const s = HANUKKAH[y]; if (!s) continue;
    const n = Math.round((Date.parse(today + "T12:00:00Z") - Date.parse(s + "T12:00:00Z")) / DAY) + (evening ? 1 : 0);
    if (n >= 0 && n <= 8) return n;   // 0 = begins tonight; the eighth day still shows night 8 until sunset
  }
  return -1;
}
function menorah(n) {
  const xs = [6, 16, 26, 36, 64, 74, 84, 94];   // candles lit from right to left, the newest on the left
  let c = "";
  xs.forEach((x, i) => { const lit = 7 - i < n; c += `<rect x="${x - 2.5}" y="22" width="5" height="16" rx="1" fill="${lit ? "#f4f1ff" : "rgba(255,255,255,.35)"}"/>` + (lit ? `<path d="M${x} 12 q4 6 0 9 q-4 -3 0 -9z" fill="#ffc94a"/>` : ""); });
  c += `<rect x="47.5" y="14" width="5" height="24" rx="1" fill="#f4f1ff"/><path d="M50 4 q4 6 0 9 q-4 -3 0 -9z" fill="#ffc94a"/>`;   // shamash
  return `<svg class="menorah" viewBox="0 0 100 56" aria-hidden="true">${c}<path d="M4 38 H96 M50 38 V50 M38 52 H62" stroke="var(--amber)" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
}
function hanukkahLine(today) {
  const n = hanukkahNight(today);
  if (n < 0) return "";
  if (n === 0) return `${menorah(0)}Hanukkah begins tonight`;
  return `${menorah(n)}Night ${n} of Hanukkah <small>Chag Sameach</small>`;
}
function specialLine(today) {
  const out = [], y = +today.slice(0, 4);

  return out.join(" · ");
}
let specialToday = false;
function renderSeason() {
  const today = isoToday(), s = seasonLine(today), sp = specialLine(today) || (Q.get("party") ? "Hercules: 10 years home" : "");
  specialToday = !!sp || (SEASON === "newyear" && md(today) === "01-01");
  const el = $("season"); el.innerHTML = [s, hanukkahLine(today), sp ? `🎉 ${sp}` : ""].filter(Boolean).map(x => `<div>${x}</div>`).join(""); el.hidden = !el.innerHTML;
}
function confetti(n = 40) {
  if (LITE) return;
  const cols = ["var(--amber)", "var(--sage)", "var(--lilac)", "var(--rose)", "#fff"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("i"); c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw"; c.style.background = cols[i % cols.length];
    c.style.setProperty("--d", (4 + Math.random() * 4) + "s"); c.style.setProperty("--x", (Math.random() * 16 - 8) + "rem"); c.style.setProperty("--r", (Math.random() * 900 - 450) + "deg");
    c.style.animationDelay = Math.random() * 2.5 + "s";

}
if (SEASON === "christmas") {

}

// Snow piling on the panel tops at home
function placeDrifts() {

}
window.wxHome = code => {

  document.documentElement.classList.toggle("snowing", snow);

cuckoo.innerHTML = `<svg viewBox="0 0 60 66" width="100%" height="100%"><path d="M4 26 L30 4 L56 26 Z" fill="#7a4a24"/><rect x="9" y="24" width="42" height="40" rx="2" fill="#a8693a"/>
  <rect x="21" y="32" width="18" height="20" rx="9" fill="#2a170a"/>

  <path class="beak" d="M24.5 10 L30 11 L24.5 12.5 Z" fill="#e8742a"/><path d="M8 13 Q2 11 1 16 Q6 18 10 17 Z" fill="#d9b24a"/></g></svg>
  <path d="M9 24 h42" stroke="#5a3418" stroke-width="2"/></svg>`;
