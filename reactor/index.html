<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* A 1984 green-phosphor control console, laid out after Morgan's mockup. The public page is only the engine;
   every label, name, joke and log line comes from the encrypted data (reactor/data.enc).
   Pi-light: no glow, blur or scanlines; a few element updates a second; alerts every couple of minutes.
   Tests: ?dinner=1 (the 4-6pm feeding cycle), ?overdue=1 (slop dispersal overdue, 6:01pm and 7:01am), ?alert=1 (an alert in 3 seconds), ?flash=1 (the breach flash). */
:root { --g: #39ff7a; --gd: #1d8c45; --amber: #ffb000; --red: #ff3b30; --panel: #06140b; color-scheme: dark; }
* { box-sizing: border-box; }
html { font-size: 16px; }
@media (min-width: 900px) { html { font-size: calc(100vw / 67.5); } }
html, body { margin: 0; height: 100%; background: #010603; }
body { font-family: "VT323", monospace; color: var(--g); overflow: hidden; }
.crt { position: fixed; inset: 0; padding: .45rem 1.2rem .7rem; display: grid; grid-template-rows: auto auto auto auto auto auto minmax(0, 1fr) auto; gap: .5rem; }
.access { display: flex; justify-content: space-between; gap: 1rem; background: #03100a; color: var(--gd); border: 1px solid #0f4a25; padding: .1rem .6rem; font-size: 1.1rem; letter-spacing: .12em; }
.access b { font-weight: normal; color: var(--g); } .access b.no { color: var(--amber); }
header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--gd); padding-bottom: .3rem; margin-top: -.15rem; }
header h1 { margin: 0; font-size: 2.6rem; letter-spacing: .06em; font-weight: normal; line-height: 1; }
header .sub { font-size: 1.15rem; color: var(--gd); }
header .clock { font-size: 2.5rem; text-align: right; }
.consoles { display: grid; grid-template-columns: repeat(24, 1fr); gap: .3rem; }
.btn { height: 1.2rem; border-radius: 3px; border: 1px solid #0a2a15; background: #08200f; }
.btn.g { background: #1fd760; } .btn.a { background: #ffb000; } .btn.r { background: #ff3b30; } .btn.w { background: #e8f0ff; }
.lamps { display: flex; gap: .3rem .9rem; flex-wrap: wrap; align-items: center; font-size: 1.05rem; }
.lamp { display: flex; align-items: center; gap: .35rem; }
.lamp i { width: .8rem; height: .8rem; border-radius: 50%; background: var(--g); }
.lamp i.am { background: var(--amber); } .lamp i.rd { background: var(--red); }
.blink { animation: bl 1s steps(1) infinite; } @keyframes bl { 50% { opacity: .15; } }
.feed { display: none; background: #2a1a00; border: 2px solid var(--amber); color: var(--amber); font-size: 1.45rem; text-align: center; padding: .2rem; letter-spacing: .05em; }
.feed.on { display: block; animation: bl 1.2s steps(1) infinite; }
.protos { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .55rem; }
.protos .w2 { grid-column: span 2; } .protos .w4 { grid-column: span 4; } .protos .w3 { grid-column: span 3; } .protos .w6 { grid-column: span 6; }
.lampbox { display: flex; flex-direction: column; align-items: center; gap: .35rem; text-align: center; font-size: 1.3rem; color: var(--gd); padding-top: .2rem; }
.lampbox i { width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 2px solid var(--gd); background: #08200f; }
.lampbox.on { color: var(--amber); } .lampbox.on i { background: var(--amber); border-color: var(--amber); }
.lampbox.on.t i { background: var(--g); border-color: var(--g); } .lampbox.on.t { color: var(--g); }
.lampbox.on.f i { background: var(--red); border-color: var(--red); } .lampbox.on.f { color: var(--red); }
.p { border: 1px solid var(--gd); background: var(--panel); padding: .55rem .7rem; position: relative; min-height: 0; overflow: hidden; }
.p h2 { margin: 0 0 .45rem; font-weight: normal; font-size: 1.3rem; letter-spacing: .08em; border-bottom: 1px dashed var(--gd); padding-bottom: .15rem; display: flex; justify-content: space-between; gap: .5rem; white-space: nowrap; overflow: hidden; }
.p h2 span { color: var(--gd); font-size: 1rem; }
.tt { font-size: 2.1rem; padding-top: .3rem; text-align: center; letter-spacing: .1em; color: var(--amber); }
.binary { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; margin-top: .3rem; }
.bin { border: 1px solid var(--gd); text-align: center; padding: .3rem .2rem; font-size: 1.15rem; color: var(--gd); }
.bin.on { background: var(--amber); color: #1a0d00; border-color: var(--amber); }
.ohyes { height: 4.4rem; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#ohyes { display: inline-block; white-space: nowrap; transition: transform .9s ease, color .9s; font-size: 2.2rem; }
.inbox { font-size: 3.1rem; text-align: center; letter-spacing: .04em; color: var(--red); line-height: 1.05; }
.small2 { font-size: 1rem; color: var(--gd); text-align: center; }
.grid { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: .7rem; min-height: 0; }
.row { display: grid; grid-template-columns: 12.5rem 1fr 7rem; align-items: center; gap: .45rem; font-size: 1.15rem; margin: .25rem 0; }
.row > span:first-child { min-width: 0; line-height: 1.12; overflow-wrap: break-word; }   /* long labels wrap, never clip */
.row .live { color: #8fd3ff; font-size: .7em; margin-left: .25rem; }
.bar { height: .8rem; border: 1px solid var(--gd); position: relative; background: #03100a; }
.bar b { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--g); transform-origin: 0 50%; transition: transform 1.5s ease; }
.bar b.am { background: var(--amber); } .bar b.rd { background: var(--red); }
.st { text-align: right; line-height: 1.12; min-width: 0; overflow-wrap: break-word; } .st.am { color: var(--amber); } .st.rd { color: var(--red); }
#rows { font-size: 1rem; } .sys .row { font-size: 1.15em; grid-template-columns: minmax(0, 1fr) minmax(6rem, max-content); align-items: end; grid-template-areas: "l s" "b b"; gap: .1rem .4rem; margin: .4rem 0; }
.sys .row > span:first-child { grid-area: l; } .sys .row .st { max-width: 14rem; } .sys .row.one > span:first-child { grid-column: 1 / -1; white-space: normal; } .sys .row .bar { grid-area: b; } .sys .row .st { grid-area: s; }
.dials { display: grid; grid-template-columns: repeat(3, 1fr); gap: .35rem; text-align: center; font-size: .95rem; }
.dials .dv { font-size: 1.3rem; }
.dials .nd { transform-origin: 50px 54px; transition: transform 1.8s ease; }
.mid .row { grid-template-columns: minmax(0, 9rem) minmax(2rem, 1fr) minmax(0, 6.5rem); font-size: 1rem; }
.log { font-family: "Share Tech Mono", monospace; font-size: .92rem; line-height: 1.35; color: #7dffaa; display: flex; flex-direction: column; justify-content: flex-end; height: calc(100% - 2rem); overflow: hidden; }
.log div { flex: none; }
.log .am { color: var(--amber); } .log .rd { color: var(--red); }
.fillp { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.aux { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); grid-auto-rows: 1.15rem; gap: .35rem; overflow: hidden; align-content: start; }
.aux b { border-radius: 50%; border: 1px solid #0a2a15; background: #08200f; aspect-ratio: 1; height: 100%; justify-self: center; }
.aux b.g { background: #1fd760; } .aux b.a { background: #ffb000; } .aux b.r { background: #ff3b30; } .aux b.w { background: #e8f0ff; }
.ann { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(2.2rem, 1fr); gap: .3rem; overflow: hidden; }
.ann div { border: 1px solid var(--gd); display: flex; align-items: center; justify-content: center; text-align: center; font-size: .95rem; line-height: 1; color: var(--gd); background: #03100a; padding: .1rem; }
.ann div.on { background: var(--amber); color: #1a0d00; border-color: var(--amber); } .ann div.rd { background: var(--red); color: #1a0202; border-color: var(--red); }
.log { font-size: 1.05rem; }
.redact { background: #7dffaa; color: #7dffaa; padding: 0 3px; }
canvas { width: 100%; height: 6.8rem; display: block; }
footer { display: flex; justify-content: space-between; gap: 1rem; font-size: 1.05rem; color: var(--gd); border-top: 2px solid var(--gd); padding-top: .35rem; }
.alert { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); border: 4px solid var(--red); background: #1a0202; color: var(--red); padding: 1.1rem 2rem; font-size: 2.7rem; text-align: center; letter-spacing: .05em; display: none; z-index: 5; max-width: 84vw; }
.alert small { display: block; font-size: 1.5rem; color: #ffb3ad; margin-top: .35rem; }
.breach { position: fixed; inset: 0; background: rgba(40, 0, 0, .92); display: none; z-index: 7; align-items: center; justify-content: center; flex-direction: column; color: #ff6b61; text-align: center; padding: 0 1rem; }
.breach h3 { font-size: 4rem; margin: 0; font-weight: normal; letter-spacing: .08em; line-height: 1.05; }
.breach p { font-size: 1.75rem; margin: .5rem; }
@media (prefers-reduced-motion: reduce) { .blink, .feed.on { animation: none; } }
</style>
</head>
<body>
<div class="crt">
  <div class="access" id="access"></div>
  <header><div><h1 id="ttl">CONTROL CONSOLE</h1><div class="sub" id="sub"></div></div><div class="clock" id="clock">00:00:00</div></header>
  <div class="consoles" id="consoles"></div>
  <div class="lamps" id="lamps"></div>
  <div class="feed" id="feed"></div>
  <div class="protos" id="protos"></div>
  <div class="grid">
    <div style="display:grid;grid-template-rows:auto minmax(0,1fr);gap:.6rem;min-height:0"><div class="p sys"><h2 id="sysT"></h2><div id="rows"></div></div><div class="p fillp"><h2 id="auxT"></h2><div class="aux" id="aux"></div></div></div>
    <div class="p mid" style="display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:.35rem">
      <div><h2 id="chartT"></h2><canvas id="chart" width="600" height="150"></canvas></div>
      <div class="dials" id="dials"></div>
      <div id="contain"></div>
      <div class="fillp"><h2 id="annT"></h2><div class="ann" id="ann"></div></div>
    </div>
    <div class="p"><h2 id="logT"></h2><div class="log" id="log"></div></div>
  </div>
  <footer><span id="f1"></span><span id="ticker"></span><span id="f3"></span></footer>
</div>
<div class="alert" id="alert"></div>
<div class="breach" id="breach"><h3 class="blink" id="br1"></h3><p id="br2"></p><p id="br3" style="font-size:1.4rem;color:#ffb3ad"></p></div>
<script>
(async function () {
  const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search), TZ = "America/New_York";
  const KEY = location.hash.slice(1);
  const b64 = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  async function unlock(file) {
    const k = await crypto.subtle.importKey("raw", b64(KEY), "AES-GCM", false, ["decrypt"]);
    const r = await fetch(file + "?v=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error("missing");
    const { iv, ct } = await r.json();
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(iv) }, k, b64(ct))));
  }
  let D; try { D = await unlock("data.enc"); } catch (e) { $("ttl").textContent = "ACCESS DENIED"; return; }
  const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const H = (a) => `${esc(a[0])}${a[1] ? ` <span>${esc(a[1])}</span>` : ""}`;
  const hm = {}; for (const x of new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date())) hm[x.type] = +x.value;
  // Feeding cycle: pressure builds 4-6pm; the slop is overdue from 6:01pm (until 7) and from 7:01am (until 8).
  const overdue = Q.get("overdue") === "1" || ((hm.hour === 18 || hm.hour === 7) && hm.minute >= 1);
  // Thanksgiving, the fourth Thursday of November (?date=2026-11-26 previews it): its own copy (D.thanksgiving), and begging all day
  const dayIso = Q.get("date") || new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  const tgD = (y => `${y}-11-${String(1 + (4 - new Date(Date.UTC(y, 10, 1)).getUTCDay() + 7) % 7 + 21).padStart(2, "0")}`)(+dayIso.slice(0, 4));
  const TG = (dayIso === tgD || Q.get("thanksgiving") === "1") && D.thanksgiving ? D.thanksgiving : null;
  const dinner = overdue || Q.get("dinner") === "1" || (hm.hour >= 16 && hm.hour < 18) || !!TG;
  const N = D.now || {}, wx = { tempF: null, hum: null, wind: null, dublinC: null };

  /* header, consoles, lamps */
  const AC = D.access;
  $("access").innerHTML = `<span>${esc(AC.label)} <b id="lvl">${esc(AC.levels[0])}</b></span><span id="acmid"></span><span>${esc(AC.clear)} <b class="no blink">${esc(AC.verdict)}</b></span>`;
  const setAccess = () => { $("lvl").textContent = pick(AC.levels); $("acmid").textContent = TG && TG.access ? TG.access : AC.mid.replace("{s}", 7000 + Math.floor(Math.random() * 2999)); };
  setAccess(); setInterval(setAccess, 9000);
  $("ttl").textContent = D.title; $("sub").textContent = D.subtitle;
  const NB = 120, CLS = ["g", "g", "g", "g", "a", "w", "", "", "", "r"];
  $("consoles").innerHTML = Array.from({ length: NB }, () => `<div class="btn ${pick(CLS)}"></div>`).join("");
  const BTN = [...$("consoles").children];
  $("lamps").innerHTML = D.lamps.map(n => `<span class="lamp"><i></i>${esc(n)}</span>`).join("");
  const LAMP = [...$("lamps").querySelectorAll("i")];
  if (dinner) $("feed").classList.add("on");

  /* the protocol panels */
  const P = D.protos;
  $("protos").innerHTML = `
    <div class="p w2"><h2>${H(P.table)}</h2><div class="tt" id="ttMode">${esc(P.tableStates[0])}</div></div>
    <div class="p ${P.nimps ? "w2" : "w4"}"><h2>${H(P.acoustic)}</h2><div class="binary"><div class="lampbox" id="binA"><i></i>${esc(P.acousticOpts[0])}</div><div class="lampbox" id="binB"><i></i>${esc(P.acousticOpts[1])}</div></div></div>
    ${P.nimps ? `<div class="p w2"><h2>${H(P.nimps)}</h2><div class="binary"><div class="lampbox" id="niA"><i></i>${esc(P.nimpsOpts[0])}</div><div class="lampbox" id="niB"><i></i>${esc(P.nimpsOpts[1])}</div></div></div>` : ""}
    <div class="p w2"><h2>${H([P.spirits[0], ""])}</h2><div class="binary"><div class="lampbox t" id="spT"><i></i>${esc(P.spiritsOpts[0])}</div><div class="lampbox f" id="spF"><i></i>${esc(P.spiritsOpts[1])}</div></div></div>
    <div class="p w2"><h2>${H(P.ohyes)}</h2><div class="ohyes"><span id="ohyes">${esc(P.ohyesWords[1])}</span></div></div>
    <div class="p w2"><h2>${H(P.mail)}</h2><div class="inbox" id="inbox"></div></div>
    <div class="p w6"><h2>${H(P.restaurant)}</h2><div class="row" style="grid-template-columns:1fr 11rem;margin:.1rem 0"><div class="bar" style="height:1.5rem"><b id="restB"></b></div><span class="st" id="restS" style="font-size:1.6rem"></span></div></div>`;

  /* primary systems: private rows plus live ones (live rows without data are left out) */
  $("sysT").innerHTML = H(D.systems);
  const LIVE = {
    claude: () => N.claude_minutes == null ? null : [Math.min(99, N.claude_minutes / 2.4), `${Math.floor(N.claude_minutes / 60)}H ${N.claude_minutes % 60}M TODAY`],
    grocery: () => N.grocery == null ? null : [Math.min(99, N.grocery * 4), `${N.grocery} ITEMS`],
    amazon: () => N.amazon_inbound == null ? null : [Math.max(5, Math.min(99, N.amazon_inbound * 14)), N.amazon_today ? `${N.amazon_today} TODAY` + (N.amazon_inbound > N.amazon_today ? ` · ${N.amazon_inbound - N.amazon_today} MORE` : "") : N.amazon_inbound ? `${N.amazon_inbound} IN TRANSIT` : "NONE INBOUND"],
  };
  const rows = [...D.rows, ...(TG ? TG.rows || [] : [])].map(r => { const k = (r[3] || "").startsWith("live:") ? r[3].slice(5) : null; if (k) { const v = LIVE[k] && LIVE[k](); return v ? { l: r[0], v: v[0], s: v[1], live: true } : null; } if (r[3] === "cycle") { const st = String(r[2]).split(" · ").filter(Boolean); const ph = Math.min(st.length - 1, Math.floor(rnd(0, st.length))); return { l: r[0], v: ph === st.length - 1 && ph ? 92 : ph ? 30 + 40 * ph / st.length : 15, s: st[ph] || "", cycle: st, ph, until: Date.now() + rnd(60, 240) * 1000 }; }   // a random phase each showing
    return { l: r[0], v: r[1], s: r[2], fixed: r[3] === "fixed" }; }).filter(Boolean);
  const sc = v => v > 85 ? "rd" : v > 65 ? "am" : "";
  // many gauges: shrink the list's text until Primary Systems leaves the auxiliary bank at least a few rows
  setTimeout(function fitRows() {
    const box = $("rows"), sys = box.parentElement, col = sys.parentElement; let f = 1;
    while (f > .62 && sys.offsetHeight > col.clientHeight - 140) { f -= .04; box.style.fontSize = f + "rem"; }
  }, 50);
  $("rows").innerHTML = rows.map((r, i) => `<div class="row${r.s ? "" : " one"}"><span>${esc(r.l)}${r.live ? '<span class="live">◆LIVE</span>' : ""}</span><div class="bar"><b id="rb${i}"></b></div><span class="st" id="rs${i}">${esc(r.s)}</span></div>`).join("");
  // a cycling gauge steps through its statuses every few minutes: low and steady first, climbing in between, high and red at the last
  function cycleTick(r, i) {
    const n = r.cycle.length; if (n < 2) return;
    if (Date.now() > r.until) { r.ph = (r.ph + 1) % n; r.until = Date.now() + rnd(120, 300) * 1000; $("rs" + i).textContent = r.cycle[r.ph]; }
    const last = r.ph === n - 1;
    if (r.ph === 0) r.v = Math.max(8, Math.min(28, r.v + rnd(-2, 2) - (r.v > 28 ? 6 : 0)));
    else if (last) r.v = r.v < 88 ? r.v + rnd(5, 10) : Math.min(99, r.v + rnd(-1, 2));
    else { const top = 30 + 55 * r.ph / (n - 1); r.v = Math.min(top, r.v + Math.random() * .9); }   // a slow climb, about 4 minutes
  }
  function drawRows() { rows.forEach((r, i) => { if (r.cycle) cycleTick(r, i); else if (!r.live && !r.fixed) r.v = Math.max(5, Math.min(99, r.v + rnd(-4, 4))); const c = sc(r.v); $("rb" + i).className = c; $("rb" + i).style.transform = `scaleX(${(r.v / 100).toFixed(3)})`; $("rs" + i).className = "st " + c; }); }

  /* espresso core strip chart (canvas, redrawn once a second) */
  $("chartT").innerHTML = H(D.chart);
  const cx = $("chart").getContext("2d"); let pts = Array(120).fill(90);
  function drawChart() {
    pts.shift(); let n = pts[pts.length - 1] + rnd(-3, 3); if (Math.random() < .05) n = 93 + Math.random() * 4; pts.push(Math.max(60, Math.min(100, n)));
    cx.fillStyle = "#03100a"; cx.fillRect(0, 0, 600, 150); cx.strokeStyle = "#0f4a25"; cx.lineWidth = 1;
    for (let y = 0; y < 150; y += 30) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(600, y); cx.stroke(); } for (let x = 0; x < 600; x += 50) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, 150); cx.stroke(); }
    const yy = p => 150 - (p - 60) * 3.75; cx.strokeStyle = "#ff3b30"; cx.setLineDash([6, 6]); cx.beginPath(); cx.moveTo(0, yy(96)); cx.lineTo(600, yy(96)); cx.stroke(); cx.setLineDash([]);
    cx.strokeStyle = "#39ff7a"; cx.lineWidth = 2; cx.beginPath(); pts.forEach((p, i) => i ? cx.lineTo(i * 5, yy(p)) : cx.moveTo(0, yy(p))); cx.stroke();
    cx.fillStyle = "#39ff7a"; cx.font = "20px VT323"; cx.fillText(D.chart[2].replace("{t}", pts[pts.length - 1].toFixed(1)), 8, 20);
  }

  /* dials */
  const dv = { nap: 64, tabs: 47 };
  const DV = { nap: () => [dv.nap, Math.round(dv.nap) + "%"], tabs: () => [dv.tabs, Math.round(dv.tabs) + ""],
    temp: () => wx.tempF == null ? [0, "--"] : [wx.tempF, Math.round(wx.tempF) + "°F"], hum: () => wx.hum == null ? [0, "--"] : [wx.hum, Math.round(wx.hum) + "%"],
    wind: () => wx.wind == null ? [0, "--"] : [wx.wind * 4, Math.round(wx.wind) + " MPH"], dublin: () => wx.dublinC == null ? [0, "--"] : [wx.dublinC * 4, Math.round(wx.dublinC) + "°C"] };
  $("dials").innerHTML = D.dials.map((d, i) => `<div><svg viewBox="0 0 100 58" width="100%"><path d="M10,54 A40,40 0 0 1 90,54" fill="none" stroke="#1d8c45" stroke-width="3"/><path d="M74,22 A40,40 0 0 1 90,54" fill="none" stroke="#ff3b30" stroke-width="3"/><line class="nd" id="nd${i}" x1="50" y1="54" x2="12" y2="54" stroke="#39ff7a" stroke-width="2.5"/><circle cx="50" cy="54" r="3" fill="#39ff7a"/></svg><div>${esc(d[0])}</div><div class="dv" id="dv${i}"></div></div>`).join("");
  function drawDials() {
    dv.nap = Math.max(5, Math.min(99, dv.nap + rnd(-5, 5))); dv.tabs = Math.max(10, Math.min(99, dv.tabs + rnd(-2, 4)));
    D.dials.forEach((d, i) => { const [v, t] = (DV[d[1]] || (() => [0, "--"]))(); $("nd" + i).style.transform = `rotate(${(Math.min(100, Math.max(0, v)) * 1.8).toFixed(1)}deg)`; $("dv" + i).textContent = t; });
  }

  /* auxiliary bank and annunciator panel: fill the columns */
  $("auxT").innerHTML = H(D.aux || ["AUXILIARY BANK", ""]);
  $("aux").innerHTML = Array.from({ length: 300 }, () => `<b class="${pick(CLS)}"></b>`).join("");
  const AUX = [...$("aux").children];
  $("annT").innerHTML = H(D.annTitle || ["ANNUNCIATOR PANEL", ""]);
  $("ann").innerHTML = (D.annunciators || []).map(n => `<div>${esc(n)}</div>`).join("");
  const ANN = [...$("ann").children];

  /* containment */
  const C = D.containment;
  $("contain").innerHTML = `<h2>${H(C.title)}</h2>
    <div class="row"><span>${esc(C.hostility[0])}</span><div class="bar"><b id="hostB" class="am" style="transform:scaleX(.74)"></b></div><span class="st am" id="hostS">${esc(C.hostility[1])}</span></div>
    ${C.rows.map(r => `<div class="row"><span>${esc(r[0])}</span><div class="bar"><b style="transform:scaleX(${r[1] / 100})"></b></div><span class="st">${esc(r[2])}</span></div>`).join("")}
    <div class="row"><span>${esc(C.nimona[0])}</span><div class="bar"><b style="transform:scaleX(.15)"></b></div><span class="st" id="nimS">${esc(C.nimona[1])}</span></div>
    <div class="row" style="grid-template-columns:9.5rem 1fr 1fr"><span>${esc(C.nims)}</span><div class="bin" id="nimY">YES</div><div class="bin on" id="nimN">NO</div></div>
    <div class="row"><span>${esc(C.bark[0])}</span><div class="bar"><b id="barkB"></b></div><span class="st" id="barkS">${esc(C.bark[1])}</span></div>`;

  /* weather: Leeds post office and Dublin */
  async function loadWx() {
    try {
      const a = await (await fetch("https://api.open-meteo.com/v1/forecast?latitude=42.355&longitude=-72.703&current=temperature_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph")).json();
      wx.tempF = a.current.temperature_2m; wx.hum = a.current.relative_humidity_2m; wx.wind = a.current.wind_speed_10m;
      const b = await (await fetch("https://api.open-meteo.com/v1/forecast?latitude=53.349&longitude=-6.261&current=temperature_2m")).json();
      wx.dublinC = b.current.temperature_2m;
    } catch (e) {}
    drawDials();
  }

  /* event log */
  $("logT").innerHTML = H(D.logTitle);
  let mail = P.mailStart, seen = 0;
  const msgs = [...D.log, ...(TG ? TG.log || [] : [])].filter(m => !m[2]);
  if (dinner) msgs.push(...D.dinner.log);
  let deck = [];
  const draw = () => { if (!deck.length) deck = msgs.map(m => [Math.random(), m]).sort((a, b) => a[0] - b[0]).map(x => x[1]); return deck.pop(); };
  function fill(t) { return t.replace("{dublinC}", wx.dublinC == null ? "--" : Math.round(wx.dublinC)).replace("{tempF}", wx.tempF == null ? "--" : Math.round(wx.tempF)).replace("{hum}", wx.hum == null ? "--" : Math.round(wx.hum)).replace("{wind}", wx.wind == null ? "--" : Math.round(wx.wind)).replace("{mailM}", Math.floor(mail / 1e6) + 1); }
  const lines = [];
  function addLog(m) {
    if (!m) { for (let k = 0; k < 5; k++) { m = draw(); if (!(wx.tempF == null && /\{(dublinC|tempF|hum|wind)\}/.test(m[1]))) break; } }
    const t = new Date().toLocaleTimeString("en-GB", { timeZone: TZ, hour12: false });
    lines.push(`<div class="${m[0]}">${t} ${m[0] === "rd" ? "**" : ">"} ${esc(fill(m[1])).replace(/█+/g, x => `<span class="redact">${x}</span>`)}</div>`);
    if (lines.length > 40) lines.shift();
    const el = $("log"); el.innerHTML = lines.join("");
    const used = () => [...el.children].reduce((h, c) => h + c.offsetHeight, 0);   // bottom-aligned overflow doesn't scroll, so add up the lines
    while (el.children.length > 1 && used() > el.clientHeight) { el.removeChild(el.firstChild); lines.shift(); }   // no half-cut line at the top
  }

  /* critical alerts and the breach flash: rare on the wall */
  const crit = [...(TG ? TG.crit || [] : []), ...D.crit]; if (overdue) crit.unshift(D.dinner.crit);
  let ci = 0;
  let bearOn = false, bearAnn = null;
  function critical(force) {
    if (bearOn && !force) return;
    const c = force || crit[ci++ % crit.length], a = $("alert");
    a.innerHTML = `⚠ ${esc(c[0])} ⚠<small>${esc(c[1])}</small>`; a.style.display = "block"; a.classList.add("blink");
    $("ticker").textContent = "!! " + c[0] + " !!"; $("ticker").style.color = "#ff3b30"; addLog(["rd", c[0] + " · " + c[1]]);
    if (c[2] === "hostile") { $("hostS").textContent = C.hostility[2]; $("hostS").className = "st rd"; $("hostB").className = "rd"; $("hostB").style.transform = "scaleX(.97)"; $("nimS").textContent = C.nimona[2]; }
    setTimeout(() => { a.style.display = "none"; a.classList.remove("blink"); $("ticker").textContent = D.footer[3]; $("ticker").style.color = "";
      $("hostS").textContent = C.hostility[1]; $("hostS").className = "st am"; $("hostB").className = "am"; $("hostB").style.transform = "scaleX(.74)"; $("nimS").textContent = C.nimona[1]; }, 6000);
  }
  function breach() { $("br1").textContent = D.breach[0]; $("br2").textContent = D.breach[1]; $("br3").textContent = D.breach[2]; $("breach").style.display = "flex"; setTimeout(() => $("breach").style.display = "none", 3500); }
  /* incidents: one sequence played in order, at most one per showing (bear, pantry or internet, each in about 28% of showings; ?bear=1, ?pantry=1 or ?internet=1 forces one) */
  const INC = [["bear", D.bear], ["pantry", D.pantry], ["internet", D.internet]].filter(x => x[1] && x[1].seq && x[1].seq.length);
  const roll = Math.random(), forced = INC.find(([k]) => Q.get(k));
  const chosen = forced || (INC.length && roll < .84 ? INC[Math.floor(roll / .84 * INC.length)] : null);
  if (chosen) {
    const B = chosen[1]; let step = 0;
    bearAnn = B.ann ? [...$("ann").children].find(e => e.textContent === B.ann) || null : null;
    const next = () => {
      const m = B.seq[step]; addLog([m[0], m[1]]);
      if (step === B.critAt) { bearOn = true; critical(B.crit); }
      if (step === B.clearAt) bearOn = false;
      if (++step < B.seq.length) setTimeout(next, rnd(16, 21) * 1000); else bearOn = false;
    };
    setTimeout(next, forced ? 2000 : rnd(15, 30) * 1000);
  }
  setTimeout(critical, Q.get("alert") ? 3000 : rnd(35, 70) * 1000); setInterval(critical, rnd(110, 150) * 1000);
  if (Q.get("flash") || Math.random() < .35) setTimeout(breach, Q.get("flash") ? 4000 : rnd(70, 180) * 1000);

  /* footer */
  $("f1").textContent = D.footer[0]; $("ticker").textContent = D.footer[1];

  /* the loops, a handful of element updates a second */
  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString("en-GB", { timeZone: TZ, hour12: false });
    $("f3").textContent = D.footer[2].replace("{gw}", (1.1 + Math.random() * .2).toFixed(2));
    const d = 1 + Math.floor(Math.random() * 4); mail += d; seen += d; $("inbox").textContent = mail.toLocaleString("en-US");
    if (dinner) $("feed").textContent = D.feed.replace("{db}", 70 + Math.floor(Math.random() * 30));
  }
  /* restaurant: a probability, 0-100%, drifting, with the odd surge of optimism and the odd collapse */
  let rest = 42;
  function restTick() { const r = Math.random(); rest = r < .06 ? 88 + Math.random() * 11.9 : r < .1 ? 3 + Math.random() * 10 : Math.max(.1, Math.min(99.9, rest + (Math.random() - .45) * 9));
    const c = rest > 85 ? "rd" : rest > 65 ? "am" : ""; $("restB").style.transform = `scaleX(${(rest / 100).toFixed(3)})`; $("restB").className = c; $("restS").textContent = "P = " + rest.toFixed(1) + "%"; $("restS").className = "st " + c; }
  function ohTick() { const s = .45 + Math.random() * 1.6, e = $("ohyes"); e.style.transform = `scale(${s.toFixed(2)})`; e.textContent = s > 1.45 ? P.ohyesWords[2] : s > .85 ? P.ohyesWords[1] : P.ohyesWords[0]; e.style.color = s > 1.45 ? "#ffb000" : "#39ff7a"; }
  function flips() {
    const a = Math.random() < .5; $("binA").className = "lampbox" + (a ? " on" : ""); $("binB").className = "lampbox" + (a ? "" : " on");
    if ($("niA")) { const n = Math.random() < .5; $("niA").className = "lampbox" + (n ? " on" : ""); $("niB").className = "lampbox" + (n ? "" : " on"); }
    const t = Math.random() < .5; $("spT").className = "lampbox t" + (t ? " on" : ""); $("spF").className = "lampbox f" + (t ? "" : " on");
    const y = Math.random() < .35; $("nimY").className = "bin" + (y ? " on" : ""); $("nimN").className = "bin" + (y ? "" : " on");
  }
  function bark() { const v = Math.random(); $("barkB").style.transform = `scaleX(${(.15 + v * .8).toFixed(2)})`; $("barkB").className = v > .75 ? "am" : ""; $("barkS").textContent = v > .75 ? C.bark[2] : C.bark[1]; $("barkS").className = "st" + (v > .75 ? " am" : ""); }
  setInterval(() => { for (let k = 0; k < 4; k++) pick(BTN).className = "btn " + pick(CLS); for (let k = 0; k < 3; k++) pick(AUX).className = pick(CLS); }, 300);
  setInterval(() => { const e = pick(ANN); if (!e) return; const r = Math.random(); e.className = r < .55 ? "" : r < .92 ? "on" : "rd"; if (bearAnn) bearAnn.className = bearOn ? "rd" : bearAnn === e ? "" : bearAnn.className; }, 700);
  ANN.forEach(e => { const r = Math.random(); e.className = r < .6 ? "" : r < .93 ? "on" : "rd"; });
  setInterval(() => { const r = Math.random(); pick(LAMP).className = r < .1 ? "am blink" : r < .14 ? "rd blink" : ""; }, 900);
  setInterval(tick, 1000); setInterval(drawChart, 1000); setInterval(restTick, 2000); setInterval(ohTick, 1800);
  setInterval(() => { drawRows(); drawDials(); }, 3000); setInterval(flips, 3500); setInterval(bark, 4000);
  if (TG) { $("ttMode").textContent = TG.table || "INITIATED"; $("ttMode").style.color = "#ffb000"; }   // stuck on INITIATED all day
  else setInterval(() => { const s = pick(P.tableStates); $("ttMode").textContent = s; $("ttMode").style.color = s === "STANDBY" || s === "CONCLUDED" ? "#1d8c45" : "#ffb000"; }, 7000);
  setInterval(() => addLog(), 2400);
  for (let i = 0; i < 24; i++) addLog();
  tick(); drawChart(); drawRows(); restTick(); ohTick(); bark(); loadWx();
})();
</script>
</body>
</html>
