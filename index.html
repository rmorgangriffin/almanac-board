<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Boards</title>
<style>
  html, body { margin: 0; height: 100%; background: #11152a; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; transition: opacity .8s; }
  iframe.hide { opacity: 0; }
</style>
</head>
<body>
<iframe id="a" title="Board"></iframe>
<iframe id="b" title="Board" class="hide"></iframe>
<script>
// Picks a board from schedule.json and shows it full screen.
// The secret after # is handed to the board so it can unlock its private data.
// Add ?board=name to force one board (handy for previewing).
// Rules are checked in order; each may limit by dates ["YYYY-MM-DD"], days [0=Sun..6], and from/to "HH:MM".
const key = location.hash.slice(1);
const forced = new URLSearchParams(location.search).get("board");
let schedule = { default: "almanac", rules: [] }, current = null, front = "a";

function nowParts() {
  const p = {}; for (const x of new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date())) p[x.type] = x.value;
  return { dow: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday), hm: `${p.hour}:${p.minute}`, date: `${p.year}-${p.month}-${p.day}` };
}
function pick() {
  if (forced) return forced;
  const { dow, hm, date } = nowParts();
  for (const r of schedule.rules || []) {
    if (r.dates && !r.dates.includes(date)) continue;
    if (r.days && !r.days.includes(dow)) continue;
    const from = r.from || "00:00", to = r.to || "24:00";
    if (from <= to ? (hm >= from && hm < to) : (hm >= from || hm < to)) return r.board;
  }
  return schedule.default;
}
function show(board) {
  if (board === current) return;
  current = board;
  const next = front === "a" ? "b" : "a", el = document.getElementById(next), old = document.getElementById(front);
  el.onload = () => { el.classList.remove("hide"); old.classList.add("hide"); setTimeout(() => { old.src = "about:blank"; }, 1000); };
  el.src = `${board}/?v=${Date.now()}#${key}`;
  front = next;
}
async function loadSchedule() {
  try { const r = await fetch("schedule.json?v=" + Date.now(), { cache: "no-store" }); if (r.ok) schedule = await r.json(); } catch (e) {}
  show(pick());
}
loadSchedule();
setInterval(() => show(pick()), 60000);
setInterval(loadSchedule, 10 * 60000);
// pick up page changes once a night
setInterval(() => { const { hm } = nowParts(); if (hm === "03:30") location.reload(); }, 60000);
</script>
</body>
</html>
