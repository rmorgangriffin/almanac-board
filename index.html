<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Boards</title>
<style>
  html, body { margin: 0; height: 100%; background: #11152a; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; transition: opacity .8s; }
  iframe.hide { opacity: 0; }
</style>
</head>
<body>
<iframe id="a" title="Board"></iframe>
<iframe id="b" title="Board" class="hide"></iframe>
<script>
// Picks a board from schedule.json and shows it full screen.
// The secret after # is handed to the board so it can unlock its private data.
// Add ?board=name to force one board (handy for previewing).
// Rules are checked in order; each may limit by dates ["YYYY-MM-DD"], a range start/end "YYYY-MM-DD" (inclusive), days [0=Sun..6], and from/to "HH:MM".
const key = location.hash.slice(1);
const forced = new URLSearchParams(location.search).get("board");
let schedule = { default: "almanac", rules: [] }, current = null, front = "a", first = true;

function nowParts() {
  const p = {}; for (const x of new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date())) p[x.type] = x.value;
  return { dow: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday), hm: `${p.hour}:${p.minute}`, date: `${p.year}-${p.month}-${p.day}` };
}
// Reactor mode takes over the wall once or twice a day at random, 7am to 10pm, about 4 minutes each time,
// with a good chance of one showing during the feeding cycle (4-6pm, or overdue at 6:01-7pm and 7:01-8am). Same slots on every reload.
function reactorSlots(date) {
  let h = 2166136261; for (const c of "reactor" + date) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
  const slots = [], n = rnd() < .5 ? 2 : 1, r = rnd();
  if (r < .45) slots.push(960 + Math.floor(rnd() * 115));            // 4:00-5:55pm, feeding cycle pressure
  else if (r < .65) slots.push(1081 + Math.floor(rnd() * 54));       // 6:01-6:55pm, slop dispersal overdue
  else if (r < .75) slots.push(423 + Math.floor(rnd() * 52));        // 7:03-7:55am, overdue again (after the 7:00 greeting)
  while (slots.length < n) slots.push(430 + Math.floor(rnd() * 885));   // 7:10am-9:55pm
  const out = slots.map(m => [m, m + 4]);
  // Thanksgiving (fourth Thursday of November): an extra, longer showing at 4:40pm, as dinner pressure peaks
  const y = +date.slice(0, 4), d1 = new Date(Date.UTC(y, 10, 1)).getUTCDay();
  if (date === `${y}-11-${String(1 + (4 - d1 + 7) % 7 + 21).padStart(2, "0")}`) out.push([1000, 1010]);
  return out;
}
function pick() {
  if (forced) return forced;
  const { dow, hm, date } = nowParts();
  const mins = +hm.slice(0, 2) * 60 + +hm.slice(3);
  if (reactorSlots(date).some(([a, b]) => mins >= a && mins < b)) return "reactor";
  for (const r of schedule.rules || []) {
    if (r.dates && !r.dates.includes(date)) continue;
    if ((r.start && date < r.start) || (r.end && date > r.end)) continue;
    if (r.days && !r.days.includes(dow)) continue;
    const from = r.from || "00:00", to = r.to || "24:00";
    if (from <= to ? (hm >= from && hm < to) : (hm >= from || hm < to)) return r.board + (r.params ? "?" + r.params : "");   // params: e.g. "bear=1" for a one-off showing
  }
  return schedule.default;
}
function show(board) {
  if (board === current) return;
  current = board;
  const next = front === "a" ? "b" : "a", el = document.getElementById(next), old = document.getElementById(front);
  const swap = () => { if (el.dataset.shown) return; el.dataset.shown = 1; el.classList.remove("hide"); old.classList.add("hide"); setTimeout(() => { old.src = "about:blank"; delete old.dataset.shown; }, 1000); };
  delete el.dataset.shown;
  el.onload = swap;
  setTimeout(swap, first ? 0 : 8000);   // never wait on slow-loading fonts or images to show the board
  first = false;
  const [b, q] = board.split("?");
  el.src = `${b}/?${q ? q + "&" : ""}v=${Date.now()}#${key}`;
  front = next;
}
async function loadSchedule() {
  try { const r = await fetch("schedule.json?v=" + Date.now(), { cache: "no-store" }); if (r.ok) schedule = await r.json(); } catch (e) {}
  show(pick());
}
loadSchedule();
setInterval(() => show(pick()), 60000);
setInterval(loadSchedule, 10 * 60000);
// pick up page changes once a night
setInterval(() => { const { hm } = nowParts(); if (hm === "03:30") location.reload(); }, 60000);
</script>
</body>
</html>
